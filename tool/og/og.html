<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PocketCRM OG Image</title>
  <style>
    @font-face {
      font-family: "Inter";
      src: url("../../docs/assets/fonts/InterVariable.woff2") format("woff2");
      font-weight: 400 600;
      font-style: normal;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #F7F7F5;
      color: #17171A;
      font-family: "Inter", -apple-system, sans-serif;
    }
    .og {
      width: 1200px;
      height: 630px;
      padding: 64px 72px;
      display: grid;
      grid-template-columns: 1fr 310px;
      gap: 64px;
      align-items: center;
    }
    .wordmark {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: #17171A;
      margin-bottom: 28px;
    }
    h1 {
      font-size: 56px;
      line-height: 62px;
      font-weight: 600;
      letter-spacing: -1.4px;
      color: #17171A;
      margin-bottom: 24px;
    }
    .sub {
      font-size: 22px;
      line-height: 32px;
      color: #4A4A54;
    }
    .phone {
      width: 300px;
      padding: 8px;
      border-radius: 38px;
      background: #17171A;
      margin-top: 44px;
    }
    .phone img {
      display: block;
      width: 100%;
      border-radius: 30px;
    }
  </style>
</head>
<body>
  <div class="og">
    <div>
      <div class="wordmark">PocketCRM</div>
      <h1>Remember every conversation.<br>Follow up on time.</h1>
      <p class="sub">Android app · No account · Works offline</p>
    </div>
    <div class="phone">
      <img src="../../docs/assets/screen-today.png" alt="Today screen">
    </div>
  </div>
</body>
</html>
